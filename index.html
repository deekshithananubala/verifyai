<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VerifyAI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>VerifyAI</h1>
      <p>Information Consistency Checker</p>
    </div>

    <div class="cards">

      <!-- Information A -->
      <div class="card">
        <h2>Information A</h2>

        <label>Name</label>
        <input id="nameA" type="text" placeholder="Enter name">

        <label>Date of Birth</label>
        <input id="dobA" type="date">

        <label>Email</label>
        <input id="emailA" type="email" placeholder="Enter email">

        <label>Phone Number</label>
        <input id="phoneA" type="tel" placeholder="Enter phone number">

        <label>Address</label>
        <textarea id="addressA" placeholder="Enter address"></textarea>
      </div>

      <!-- Information B -->
      <div class="card">
        <h2>Information B</h2>

        <label>Name</label>
        <input id="nameB" type="text" placeholder="Enter name">

        <label>Date of Birth</label>
        <input id="dobB" type="date">

        <label>Email</label>
        <input id="emailB" type="email" placeholder="Enter email">

        <label>Phone Number</label>
        <input id="phoneB" type="tel" placeholder="Enter phone number">

        <label>Address</label>
        <textarea id="addressB" placeholder="Enter address"></textarea>
      </div>

    </div>

    <div class="buttons">
      <button id="checkButton">Check Consistency</button>
      <button id="resetButton">Reset</button>
    </div>

    <div id="result"></div>

  </div>

  <script src="script.js"></script>

</body>

</html>
